<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f3">
<title>三餐日記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="三餐日記">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="ds/industry/styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="stage">
  <div class="phone blueprint" id="phone">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

    <header class="statusbar">
      <span id="clock">--:--</span>
      <span class="statusbar-brand">MEAL LOG</span>
      <span id="status-day"></span>
    </header>

    <main class="scr" id="screen"></main>

    <div id="toast-root"></div>
    <div id="dialog-root"></div>

    <nav class="tabbar">
      <button class="fab" id="fab" data-act="add-quick" aria-label="新增記錄">＋</button>
      <div class="tabs" id="tabs"></div>
    </nav>
  </div>
</div>

<div class="print-view" id="print-root" hidden></div>

<input type="file" accept="image/*" id="file-album" hidden>
<input type="file" accept="image/*" capture="environment" id="file-camera" hidden>
<input type="file" accept="application/json,.json" id="file-restore" hidden>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
